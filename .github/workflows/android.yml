name: Build World Laboratory Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 Standard and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Usa v4 para evitar el paquete Android SDK "tools" obsoleto.
      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: 'yes'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android export packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Verify Godot and import project
        run: |
          godot --version
          mkdir -p build
          godot --headless --editor --path . --quit

      - name: Run contract tests
        run: godot --headless --path . -s tests/test_contracts.gd

      - name: Export Android Debug APK
        run: godot --headless --path . --export-debug "Android Debug" build/WorldLaboratory-debug.apk

      - name: Verify APK output
        run: test -s build/WorldLaboratory-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldLaboratory-Android-Debug
          path: build/WorldLaboratory-debug.apk
          if-no-files-found: error
          retention-days: 14
