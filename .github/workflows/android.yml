name: Build World Laboratory Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
          accept-android-sdk-licenses: true
      - name: Install Godot 4.7.2
        run: |
          GODOT_VERSION=4.7.2
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          sudo install godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz -d templates
          cp -r templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export Android Debug
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android Debug" build/WorldLaboratory-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldLaboratory-Android-Debug
          path: build/WorldLaboratory-debug.apk
          if-no-files-found: error
